<!doctype html>
<html lang="fr"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Prix Jeux">
<title>Recherche Prix Jeux</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f4f6;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{background:#111827;color:white;padding:24px 16px 20px;position:sticky;top:0;z-index:2}h1{font-size:24px;margin:0 0 6px}.sub{opacity:.75;font-size:14px}.wrap{max-width:900px;margin:auto;padding:16px}.bar{display:flex;gap:10px;flex-wrap:wrap}.search{flex:1;min-width:200px;padding:14px 16px;border:1px solid #d1d5db;border-radius:14px;font-size:16px;background:white}.btn{display:inline-flex;align-items:center;justify-content:center;padding:13px 16px;border-radius:14px;border:0;background:#111827;color:white;font-weight:700;cursor:pointer}.btn.secondary{background:#e5e7eb;color:#111827}.status{margin:12px 0;color:#6b7280;font-size:14px}.drop{border:2px dashed #d1d5db;border-radius:18px;padding:18px;text-align:center;background:white;margin-bottom:16px}.drop input{display:none}.cards{display:grid;gap:10px}.card{display:flex;align-items:center;gap:12px;background:white;border-radius:16px;padding:10px;box-shadow:0 1px 3px #00000012}.card img{width:64px;height:64px;object-fit:contain;border-radius:10px;background:#f9fafb}.info{flex:1;min-width:0}.name{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.console{font-size:13px;color:#6b7280;margin-top:4px}.price{font-weight:800;font-size:18px;white-space:nowrap}.empty{text-align:center;padding:40px 15px;color:#6b7280}
</style>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head><body><header><div class="wrap"><h1>🎮 Recherche Prix Jeux</h1><div class="sub">Charge tes fichiers Excel et retrouve rapidement les jeux les plus chers.</div></div></header>
<main class="wrap"><div class="drop"><label class="btn" for="files">📂 Charger XLSX</label><input id="files" type="file" accept=".xlsx" multiple><div class="status" id="status">Aucun fichier chargé</div></div>
<div class="bar"><input id="search" class="search" placeholder="Rechercher un jeu…"><button class="btn secondary" id="clear">Effacer</button></div><div class="status" id="loading"></div><section id="list" class="cards"></section></main>
<script>
const $=id=>document.getElementById(id);let base=JSON.parse(localStorage.getItem('prixJeux')||'[]');
function norm(s){return String(s??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase()}
function num(v){if(typeof v==='number')return v;let s=String(v??'').replace(/[^0-9,.-]/g,'').replace(',','.');let n=parseFloat(s);return Number.isFinite(n)?n:0}
function xmlDoc(s){return new DOMParser().parseFromString(s,'application/xml')}
async function images(zip){let out={};let drawing=Object.keys(zip.files).find(x=>/^xl\/drawings\/drawing\d+\.xml$/.test(x));if(!drawing)return out;let d=xmlDoc(await zip.file(drawing).async('text'));let relPath=drawing.replace('xl/drawings/','xl/drawings/_rels/')+'.rels';let rels={};if(zip.file(relPath)){let r=xmlDoc(await zip.file(relPath).async('text'));for(let e of [...r.getElementsByTagName('Relationship')])rels[e.getAttribute('Id')]=e.getAttribute('Target')}
let media={};for(let p of Object.keys(zip.files)){if(p.startsWith('xl/media/')){let f=zip.file(p);let ext=p.split('.').pop().toLowerCase();let mime=ext==='png'?'image/png':ext==='gif'?'image/gif':ext==='webp'?'image/webp':'image/jpeg';media[p]='data:'+mime+';base64,'+await f.async('base64')}}
for(let anc of [...d.getElementsByTagName('*')]){if(anc.localName!=='twoCellAnchor'&&anc.localName!=='oneCellAnchor')continue;let from=anc.getElementsByTagName('from')[0],pic=anc.getElementsByTagName('pic')[0];if(!from||!pic)continue;let col=+(from.getElementsByTagName('col')[0]?.textContent||0),row=+(from.getElementsByTagName('row')[0]?.textContent||0);let blip=pic.getElementsByTagName('blip')[0];let target=rels[blip?.getAttribute('r:embed')||blip?.getAttribute('embed')];if(target){let p=new URL(target,'https://x/xl/drawings/').pathname.replace(/^\//,'');if(!p.startsWith('xl/'))p='xl/drawings/'+target.replace(/^\.\//,'');let key=row+'_'+col;if(media[p])out[key]=media[p]}}
return out}
async function parse(file){let buf=await file.arrayBuffer(),zip=await JSZip.loadAsync(buf);let wb=XLSX.read(buf,{type:'array'}),ws=wb.Sheets[wb.SheetNames[0]],rows=XLSX.utils.sheet_to_json(ws,{defval:''}),imgs=await images(zip);return rows.map((r,i)=>{let vals=Object.values(r);let name=r.Nom??r.nom??r.Name??r.name??r['Nom du jeu']??vals[0]??'';let price=r.Prix??r.prix??r.Price??r.price??r['Prix']??vals[1]??0;let consoleName=r.Console??r.console??r.Platform??r.platform??r['Console']??'';return {nom:String(name),prix:num(price),console:String(consoleName),image:imgs[(i+1)+'_0']||''}}).filter(x=>x.nom)}
function save(){localStorage.setItem('prixJeux',JSON.stringify(base))}
function render(q=''){let arr=base.filter(x=>!q||norm(x.nom).includes(norm(q))).slice().sort((a,b)=>b.prix-a.prix).slice(0,100);$('list').innerHTML=arr.length?arr.map(x=>`<article class="card"><img src="${x.image||''}" onerror="this.style.visibility='hidden'"><div class="info"><div class="name">${esc(x.nom)}</div><div class="console">${esc(x.console)}</div></div><div class="price">${x.prix.toFixed(0)}$</div></article>`).join(''):'<div class="empty">Aucun résultat.</div>';}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
$('files').onchange=async e=>{let files=[...e.target.files];if(!files.length)return;$('loading').textContent='Chargement…';for(let f of files){try{let data=await parse(f);base.push(...data);$('status').textContent=`${base.length} jeu(x) chargé(s)`}catch(err){console.error(err);alert('Impossible de lire '+f.name)}}save();$('loading').textContent='';render($('search').value);e.target.value=''};
$('search').oninput=e=>render(e.target.value);$('clear').onclick=()=>{if(confirm('Effacer tous les jeux enregistrés ?')){base=[];save();render();$('status').textContent='Aucun fichier chargé'}};render();if(base.length)$('status').textContent=`${base.length} jeu(x) enregistré(s)`;
</script></body></html>
